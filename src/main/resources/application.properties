# ============================================================
# APPLICATION
# ============================================================

spring.application.name=invoice-api


# ============================================================
# JPA / HIBERNATE
# ============================================================

# Flyway é responsável por alterar o schema.
# Hibernate apenas valida se as Entities correspondem ao banco.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false


# ============================================================
# FLYWAY
# ============================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true


# ============================================================
# JWT
# ============================================================

# Tempo de validade do access token: 1 hora
security.jwt.expiration-ms=3600000


# ============================================================
# INVITATIONS
# ============================================================

app.invitation.expiration-days=7


# ============================================================
# NOTIFICATIONS
# ============================================================

app.notifications.poll-interval-ms=30000
app.notifications.max-attempts=5


# ============================================================
# FILE UPLOAD
# ============================================================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
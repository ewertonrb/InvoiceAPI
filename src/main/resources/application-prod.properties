# ============================================================
# DATABASE - PRODUCTION
# ============================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================================
# JPA - PRODUCTION
# ============================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false


# ============================================================
# JWT - PRODUCTION
# ============================================================

security.jwt.secret=${JWT_SECRET}


# ============================================================
# FRONTEND - PRODUCTION
# ============================================================

app.frontend.base-url=${FRONTEND_BASE_URL:https://app.digitae.com.au}
app.auth.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}
app.auth.password-reset.frontend-base-url=${FRONTEND_BASE_URL:https://app.digitae.com.au}
app.auth.password-reset.expose-development-link=false


# ============================================================
# NOTIFICATIONS - PRODUCTION
# ============================================================

app.notifications.email-enabled=${EMAIL_NOTIFICATIONS_ENABLED:true}


# ============================================================
# MAIL
# ============================================================

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLED:true}

app.notifications.from=${MAIL_FROM:}
